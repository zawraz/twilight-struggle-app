[build]
  # Deploys the sync server's functions (convex/) first, then builds the app pointed at it.
  # Needs CONVEX_DEPLOY_KEY (a production deploy key) in Netlify's environment variables.
  command = "pnpm exec convex deploy --cmd 'pnpm run build'"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# Previews and branch builds don't deploy anything to Convex (it refuses a production key outside
# production): they use the development deployment, kept up to date by `npx convex dev`.
[context.deploy-preview]
  command = "pnpm run build"
  [context.deploy-preview.environment]
    VITE_CONVEX_URL = "https://scintillating-capybara-511.convex.cloud"

[context.branch-deploy]
  command = "pnpm run build"
  [context.branch-deploy.environment]
    VITE_CONVEX_URL = "https://scintillating-capybara-511.convex.cloud"

[dev]
  command = "vite"
  port = 5173

# Built JS/CSS have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked, or installed apps never see updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
